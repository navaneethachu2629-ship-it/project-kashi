{% extends "base.html" %}{% block title %}Transfer · Project Kashi{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACCOUNT-TO-ACCOUNT</p><h1>Transfer funds</h1><p class="muted">The transfer creates two linked ledger entries under one reference.</p></div><a class="button" href="{{ url_for('transactions') }}">← Back</a></div>
<form method="post" class="form-card"><div class="transfer-mark">↗</div><div class="form-grid">
<label class="wide">From account *<select name="source_account_id" required>{% for a in accounts %}<option value="{{ a.account_id }}">{{ a.account_number }} · Available ₹{{ "%.2f"|format(a.balance) }}</option>{% endfor %}</select></label>
<label class="wide">To account *<select name="destination_account_id" required>{% for a in accounts %}<option value="{{ a.account_id }}">{{ a.account_number }} · Current ₹{{ "%.2f"|format(a.balance) }}</option>{% endfor %}</select></label>
<label class="wide">Amount (₹) *<input type="number" name="amount" min="0.01" step="0.01" required placeholder="250.00"></label>
</div><div class="form-footer"><span class="muted">Source and destination must be different active accounts.</span><button class="button primary" type="submit">Confirm demo transfer →</button></div></form>
{% endblock %}
