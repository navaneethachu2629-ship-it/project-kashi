{% extends "base.html" %}{% block title %}New loan · Project Kashi{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">OPTIONAL MODULE</p><h1>New loan application</h1><p class="muted">For demonstration, this records an application but does not approve or disburse money.</p></div><a class="button" href="{{ url_for('loans') }}">← Back</a></div>
<form method="post" class="form-card"><div class="form-grid">
<label class="wide">Customer *<select name="customer_id" required>{% for c in customers %}<option value="{{ c.customer_id }}">{{ c.first_name }} {{ c.last_name }} · ID {{ c.customer_id }}</option>{% endfor %}</select></label>
<label>Branch *<select name="branch_id" required>{% for b in branches %}<option value="{{ b.branch_id }}">{{ b.branch_name }}</option>{% endfor %}</select></label>
<label>Loan type *<select name="loan_type" required><option>Home Loan</option><option>Education Loan</option><option>Personal Loan</option><option>Vehicle Loan</option></select></label>
<label>Loan amount (₹) *<input type="number" name="loan_amount" min="0.01" step="0.01" required></label>
<label>Interest rate (%) *<input type="number" name="interest_rate" min="0" max="99.99" step="0.01" value="8.5" required></label>
<label>Tenure (months) *<input type="number" name="tenure_months" min="1" max="600" value="36" required></label>
</div><div class="form-footer"><span class="muted">Application status will be Pending.</span><button class="button primary" type="submit">Save application →</button></div></form>
{% endblock %}
